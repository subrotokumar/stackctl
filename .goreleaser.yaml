version: 2

project_name: stackctl

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: stackctl
    main: .
    binary: stackctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/subrotokumar/stackctl/v5/cmd/core.Version=v{{.Version}}
      - -X github.com/subrotokumar/stackctl/v5/cmd/core.Commit={{.Commit}}
      - -X github.com/subrotokumar/stackctl/v5/cmd/core.Date={{.Date}}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

upx:
  # UPX doesn't support windows/arm64 or darwin builds reliably
  - enabled: true
    ids: [stackctl]          # was "default", which matched nothing
    goos: [linux]
    goarch: [amd64, arm64]
    compress: best
    lzma: true

  - enabled: true
    ids: [stackctl]
    goos: [windows]
    goarch: [amd64]
    compress: best
    lzma: true

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).