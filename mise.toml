[tasks.build]
description = "Build a stripped and compressed stackctl binary"
run = [
    "go build -trimpath -ldflags='-s -w' -o stackctl .",
    "upx --best --lzma stackctl",
]

[tasks.encrypt]
description = "Encrypt environment configuration with SOPS"
alias = "e"
run = "sops --encrypt --in-place .env.yaml"

[tasks.release]
description = "Build and publish a release with secrets from SOPS"
run = "sops exec-env .env.yaml 'goreleaser release --clean'"
