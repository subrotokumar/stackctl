# GoReleaser config with UPX compression.
# Docs: https://goreleaser.com

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: default
    # Point this at your main package, e.g. ./cmd/myapp (or "." for the root).
    main: ./...
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - "386"

# UPX compression. Needs `upx` installed on the machine running GoReleaser.
# darwin is deliberately excluded: UPX-packed macOS binaries often break
# under code signing / Gatekeeper.
upx:
  # Linux: amd64, arm64, 386
  - enabled: true
    ids: [default]
    goos: [linux]
    goarch: [amd64, arm64, "386"]
    compress: best
    lzma: true
    required: false

  # Windows: amd64, 386 (UPX doesn't support windows/arm64)
  - enabled: true
    ids: [default]
    goos: [windows]
    goarch: [amd64, "386"]
    compress: best
    lzma: true
    required: false

archives:
  - formats: [tar.gz]
    # OS and arch names match the output of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # Use zip for Windows archives.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
